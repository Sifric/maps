<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Sifric Maps · Sri Lanka</title>
    <script>
      try {
        const theme = JSON.parse(
          localStorage.getItem("lk-map-settings") || "{}",
        ).theme;
        document.documentElement.dataset.theme =
          theme === "dark" ||
          (theme !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches)
            ? "dark"
            : "light";
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.16.0/dist/maplibre-gl.css"
    />
    <link rel="stylesheet" href="/map.css?v=layers-sheet-3" />
    <script src="https://cdn.jsdelivr.net/npm/pmtiles@4.5.0/dist/pmtiles.js"></script>
  </head>
  <body>
    <nav class="rail" aria-label="Navigation">
      <button id="menu" aria-label="Open menu">
        <span data-icon="menu"></span>
      </button>
      <button id="saved" aria-label="Saved places">
        <span data-icon="bookmark"></span><small>Saved</small>
      </button>
      <button id="recent" aria-label="Recent searches">
        <span data-icon="history"></span><small>Recents</small>
      </button>
      <a class="brand" href="/" aria-label="Sifric Maps home"
        >Sifric<small>Maps</small></a
      >
    </nav>
    <main id="map" aria-label="Map of Sri Lanka"></main>
    <section class="search-shell" aria-label="Place search">
      <form id="search-form" autocomplete="off">
        <input
          id="search"
          type="search"
          aria-label="Search Sri Lanka"
          placeholder="Search Sifric Maps"
        />
        <button
          id="clear-search"
          type="button"
          aria-label="Clear search"
          hidden
        >
          <span data-icon="close"></span>
        </button>
        <button type="submit" aria-label="Search">
          <span data-icon="search"></span>
        </button>
        <span class="divider"></span>
        <button id="directions" type="button" aria-label="Open directions">
          <span data-icon="directions"></span>
        </button>
      </form>
      <div id="suggestions" role="listbox" hidden></div>
    </section>
    <nav id="categories" aria-label="Place categories">
      <button data-kind="food">
        <span data-icon="restaurant"></span> Restaurants
      </button>
      <button data-kind="shopping">
        <span data-icon="shop"></span> Shopping
      </button>
      <button data-kind="leisure">
        <span data-icon="playground"></span> Things to do
      </button>
      <button data-kind="culture">
        <span data-icon="museum"></span> Museums
      </button>
      <button data-kind="transport">
        <span data-icon="bus"></span> Transit
      </button>
      <button data-kind="health">
        <span data-icon="hospital"></span> Health
      </button>
      <button id="reset-category" aria-label="Clear category filter" hidden>
        <span data-icon="close"></span>
      </button>
    </nav>
    <aside id="panel" aria-label="Place information" hidden>
      <button id="close-panel" class="close" aria-label="Close panel">
        <span data-icon="close"></span>
      </button>
      <div id="panel-content"></div>
    </aside>
    <button id="layers" class="layers-fab" aria-label="Map layers and appearance" title="Map layers and appearance" aria-controls="layer-panel" aria-expanded="false">
      <span data-icon="layers"></span>
    </button>
    <section
      id="layer-panel"
      class="layer-panel"
      aria-label="Map appearance and layers"
      hidden
    >
      <header class="options-header">
        <h2>Layers &amp; appearance</h2>
        <button id="close-layers" aria-label="Close layers">
          <span data-icon="close"></span>
        </button>
      </header>
      <h3>Appearance</h3>
      <div class="theme-options" role="radiogroup" aria-label="Colour theme">
        <button data-theme-choice="light" role="radio" aria-checked="false">
          <span data-icon="sun"></span>Light
        </button>
        <button data-theme-choice="dark" role="radio" aria-checked="false">
          <span data-icon="moon"></span>Dark
        </button>
        <button data-theme-choice="system" role="radio" aria-checked="true">
          <span data-icon="monitor"></span>System
        </button>
      </div>
      <h3>Map type</h3>
      <div class="map-types" role="radiogroup" aria-label="Map type">
        <button data-map-type="default" role="radio" aria-checked="true">
          <span class="type-preview type-default"
            ><span data-icon="map_default"></span></span
          ><span>Default</span>
        </button>
        <button data-map-type="satellite" role="radio" aria-checked="false">
          <span class="type-preview type-satellite"
            ><span data-icon="satellite"></span></span
          ><span>Satellite</span>
        </button>
        <button data-map-type="terrain" role="radio" aria-checked="false">
          <span class="type-preview type-terrain"
            ><span data-icon="terrain"></span></span
          ><span>Terrain</span>
        </button>
      </div>
      <p id="map-type-note" class="option-note"></p>
      <h3>Map details</h3>
      <div class="map-detail-options">
        <button data-map-detail="transit" aria-pressed="false">
          <span data-icon="bus"></span
          ><span
            ><strong>Public transit</strong><small id="transit-note"></small
          ></span>
        </button>
        <button data-map-detail="traffic" aria-pressed="false" disabled>
          <span data-icon="traffic"></span
          ><span
            ><strong>Traffic</strong
            ><small id="traffic-note">Live feed not connected</small></span
          >
        </button>
        <button data-map-detail="bicycling" aria-pressed="false">
          <span data-icon="bicycle"></span
          ><span
            ><strong>Bicycling</strong><small id="bicycling-note"></small
          ></span>
        </button>
        <button data-map-detail="buildings" aria-pressed="false">
          <span data-icon="buildings"></span
          ><span
            ><strong>Raised buildings</strong><small id="buildings-note"></small
          ></span>
        </button>
      </div>
      <div class="additional-options">
        <label><input id="show-places" type="checkbox" checked /> Places</label
        ><label id="satellite-label-option" hidden
          ><input id="satellite-labels" type="checkbox" checked /> Labels on
          satellite</label
        >
      </div>
      <p id="map-provider-note" class="option-note"></p>
    </section>
    <div class="map-controls">
      <button
        id="locate"
        aria-label="Show your location"
        title="Show your location"
      >
        <span data-icon="locate"></span>
      </button>
      
      <button
        id="compass"
        aria-label="Reset bearing to north"
        title="Reset bearing to north"
      >
        <span data-icon="compass"></span>
      </button>
    </div>
    <div
      id="map-status"
      class="map-status"
      role="status"
      aria-live="polite"
    ></div>
    <div id="error" role="alert" hidden></div>
    <script type="module" src="/icons.js"></script>
    <script type="module" src="/map.js"></script>
  </body>
</html>

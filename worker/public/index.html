<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sifric Maps</title>
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vendor/maplibre-gl.css">
<style>
:root{--sh:0px;--ink:#16181d;--sub:#6b707b;--glass:rgba(255,255,255,.72);--solid:#fff;--line:rgba(20,24,35,.08);--hover:rgba(20,24,35,.055);--acc:#0a7cff;--r:22px;--shadow:0 18px 50px -12px rgba(20,30,60,.28),0 2px 6px rgba(20,30,60,.08),inset 0 1px 0 rgba(255,255,255,.6)}
[data-theme=dark]{--ink:#f2f3f6;--sub:#9aa0ac;--glass:rgba(28,30,37,.7);--solid:#2b2e37;--line:rgba(255,255,255,.09);--hover:rgba(255,255,255,.075);--shadow:0 18px 50px -12px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.07)}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font:14px/1.4 Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;color:inherit}
button:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#map{position:absolute;inset:0}
.glass{background:var(--glass);backdrop-filter:blur(28px) saturate(1.9);-webkit-backdrop-filter:blur(28px) saturate(1.9);border:1px solid var(--line);box-shadow:var(--shadow)}
#panel{position:absolute;z-index:5;top:max(14px,env(safe-area-inset-top));left:14px;width:392px;max-width:calc(100% - 28px);border-radius:var(--r);padding:8px}
.bar{display:flex;align-items:center;gap:8px;height:48px;padding:0 6px 0 14px;border-radius:15px;background:var(--hover);transition:background .2s,box-shadow .2s}
.bar:focus-within{background:var(--solid);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 60%,transparent)}
.bar svg{flex:none;fill:var(--sub)}
.bar .sicon{fill:none;stroke:var(--sub);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar input{flex:1;min-width:0;border:0;outline:0;background:none;font:500 16px Geist,Inter,system-ui;color:var(--ink)}
.bar input::placeholder{color:var(--sub)}
kbd{font:600 11px Geist,Inter;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:2px 6px;margin-right:6px}
.bar:focus-within kbd,.bar input:not(:placeholder-shown)~kbd{display:none}
@media(hover:none){kbd{display:none}}
.ib{border:0;background:none;color:var(--sub);width:34px;height:34px;border-radius:50%;cursor:pointer;display:grid;place-items:center;padding:0;transition:background .15s,color .15s}
.ib:hover{background:var(--hover)}
#chips{display:flex;gap:8px;margin:10px 0 2px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--solid);border-radius:999px;padding:4px 13px 4px 4px;font:600 13px Geist,Inter,system-ui;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06);transition:transform .15s}
.chip i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:12px}
.chip:hover{transform:translateY(-1px)}.chip:active{transform:scale(.96)}
#body{max-height:min(54vh,480px);overflow:auto;overscroll-behavior:contain;margin-top:4px;scrollbar-width:thin}
#body:empty{display:none}
.hdg{font:600 12px Geist,Inter;color:var(--sub);padding:10px 10px 4px}
.row{display:flex;gap:12px;padding:10px;border-radius:14px;cursor:pointer;align-items:center}
.row:hover,.row.sel{background:var(--hover)}
.dot{flex:none;width:34px;height:34px;border-radius:50%;background:var(--c,#ff5a4e);display:grid;place-items:center;font-size:15px;color:#fff;box-shadow:inset 0 -2px 4px rgba(0,0,0,.14)}
.tx{min-width:0;flex:1}
.row b,.card h2{display:block;font-weight:600;font-size:14.5px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row span,.card p{display:block;font-size:12.5px;color:var(--sub);margin:2px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row em{font:500 12px Geist,Inter;color:var(--sub);font-style:normal}
.msg{padding:14px 10px;color:var(--sub)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;margin-right:8px;vertical-align:-2px;animation:r .7s linear infinite}
@keyframes r{to{transform:rotate(1turn)}}
.card{padding:8px 6px 4px}
.hd{display:flex;gap:12px;align-items:center}.hd>div:nth-child(2){flex:1;min-width:0}
.hd .dot{width:44px;height:44px;font-size:19px}
.card h2{font-size:19px;font-weight:700;letter-spacing:-.015em;white-space:normal}
.card .hd p{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.facts{margin-top:12px;border-top:1px solid var(--line)}
.fact{display:flex;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13px}
.fact span{flex:none;width:78px;color:var(--sub)}.fact div{min-width:0;overflow-wrap:anywhere}
.fact a{color:var(--acc);text-decoration:none}
.btns{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;border:0;border-radius:13px;padding:12px;font:600 14px Geist,Inter,system-ui;cursor:pointer;background:var(--hover);transition:transform .12s,filter .15s}
.btn:hover{filter:brightness(.96)}.btn:active{transform:scale(.97)}
.btn.p{background:linear-gradient(180deg,#2b8cff,#0a6cf0);color:#fff;box-shadow:0 4px 14px -4px rgba(10,108,240,.6)}
.btn.on{color:var(--acc)}
.modes{display:flex;gap:4px;margin-top:14px;background:var(--hover);padding:3px;border-radius:13px}
.modes button{flex:1;border:0;background:none;padding:8px;border-radius:10px;font:600 13px Geist,Inter;color:var(--sub);cursor:pointer;transition:background .2s,color .2s}
.modes button.on{background:var(--solid);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.eta{margin-top:14px;font-size:30px;font-weight:700;letter-spacing:-.03em}
.eta small{font-size:14px;font-weight:500;color:var(--sub);margin-left:8px;letter-spacing:0}
.alts{display:flex;gap:8px;margin-top:10px}
.alts button{flex:1;border:1px solid var(--line);background:none;border-radius:12px;padding:8px 10px;font:600 13px Geist,Inter;cursor:pointer;text-align:left}
.alts small{display:block;font-weight:500;color:var(--sub);font-size:11.5px}
.alts button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.steps{margin-top:10px}.steps summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--acc);padding:4px 0}
.steps ol{list-style:none;margin:6px 0 0;padding:0;max-height:200px;overflow:auto}
.steps li{display:flex;gap:12px;padding:8px 2px;border-top:1px solid var(--line);align-items:center}
.steps li i{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--acc)}
.steps li i svg{width:20px;height:20px}
.steps b{font-weight:500;font-size:13px;display:block}.steps li span{font-size:12px;color:var(--sub)}
#updPage{position:fixed;inset:0;z-index:20;background:var(--solid)}
#updPage[hidden]{display:none}

/* missing road: draw page (uses the app's glass / Geist / accent tokens) */
#drwPage{position:fixed;inset:0;z-index:21;background:var(--solid);overflow:hidden}
#drwPage[hidden]{display:none}
#drwMap{position:absolute;inset:0}
.drwClose{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;z-index:3;width:46px;height:46px;border-radius:50%;color:var(--ink);padding:0}
#drwRet{position:absolute;z-index:2;width:32px;height:32px;pointer-events:none;transform:translate(-50%,-50%);transition:transform .14s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 2px 6px rgba(10,30,70,.35))}
#drwRet .rw1{stroke:#fff}#drwRet .rw2,#drwRet .rw3{stroke:var(--acc)}#drwRet .dot{fill:var(--acc);opacity:0;transition:opacity .14s}#drwRet.snap .dot{opacity:1}
#drwSheet{position:absolute;z-index:4;left:0;right:0;bottom:0;border-radius:24px 24px 0 0;padding:18px 18px calc(16px + env(safe-area-inset-bottom));background:var(--glass-solid,var(--glass))}
@media(min-width:641px){#drwSheet{left:14px;right:auto;width:392px;bottom:14px;border-radius:var(--r);padding-bottom:18px}}
#drwBody{max-height:calc(80vh - 40px);overflow:auto;overscroll-behavior:contain;scrollbar-width:none}
#drwBody::-webkit-scrollbar{display:none}
.drwFloat{position:absolute;left:0;bottom:calc(100% + 12px);display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding-left:14px;pointer-events:none}
.drwFloat>*{pointer-events:auto}
.drow{display:flex;gap:8px}
.dfl{display:flex;align-items:center;gap:8px;border-radius:999px;padding:10px 16px 10px 13px;font:600 13.5px Geist,Inter,system-ui;color:var(--ink);cursor:pointer;transition:transform .12s}
.dfl:active{transform:scale(.96)}.dfl svg{color:var(--acc)}
.dtip{position:relative;background:var(--ink);color:var(--solid);border-radius:10px;padding:8px 12px;font:600 12.5px Geist,Inter,system-ui;box-shadow:0 8px 20px -8px rgba(0,0,0,.45)}
.dtip::after{content:"";position:absolute;left:26px;bottom:-6px;border:6px solid transparent;border-top-color:var(--ink);border-bottom:0}
#drwSheet .sh-head{margin-bottom:6px}
#drwSheet .btns{margin-top:16px}
#drwSheet .btn{padding:14px;font-size:14.5px}
#drwSheet .btn.p{box-shadow:0 6px 16px -6px rgba(10,108,240,.7)}
#drwSheet .btn:disabled{opacity:.45;cursor:default;filter:none;transform:none;box-shadow:none}
.dl{margin:16px 0 2px;font:600 12.5px Geist,Inter,system-ui;color:var(--sub)}.dl em{font-style:normal;font-weight:500}
.dlist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.dr{display:grid;grid-template-columns:20px 1fr;column-gap:12px;align-items:center;width:100%;border:1px solid transparent;background:var(--hover);border-radius:16px;padding:12px 14px;color:var(--ink);text-align:left;cursor:pointer;font:600 14px Geist,Inter,system-ui;transition:background .15s,border-color .15s}
.dr i{width:18px;height:18px;border-radius:50%;border:2px solid var(--sub);box-sizing:border-box;position:relative;transition:border-color .15s}
.dr.on{background:color-mix(in srgb,var(--acc) 12%,transparent);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
.dr.on i{border-color:var(--acc)}.dr.on i::after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--acc)}
.dr small{grid-column:2;display:none;color:var(--sub);font:500 12.5px/1.4 Geist,Inter,system-ui;margin-top:3px}.dr.on small{display:block}
.dsum{display:flex;align-items:center;gap:10px;margin-top:8px;padding:10px 8px 10px 14px;border-radius:16px;background:var(--hover)}
.dsum div{flex:1;min-width:0}.dsum b{display:block;font:600 14.5px Geist,Inter,system-ui;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dsum span{display:block;font-size:12.5px;color:var(--sub)}
.dsum .ib{color:var(--sub)}.dsum .ib:hover{color:#e5484d}
.dnote{display:flex;align-items:center;justify-content:space-between;margin:12px 2px 0;color:var(--sub);font:500 12.5px Geist,Inter,system-ui}
.nhd{width:38px;height:38px;border-radius:50%;border:0;padding:0;background:var(--solid);color:var(--acc);display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.3);cursor:pointer;transition:transform .12s}
.nhd:active{transform:scale(.92)}
.nrow{display:flex;align-items:center;justify-content:space-between;padding:6px 0 12px;border-bottom:1px solid var(--line);font:600 15px Geist,Inter,system-ui}
.nsw{position:relative;width:46px;height:28px;border-radius:99px;border:0;background:rgba(120,125,140,.4);cursor:pointer;transition:background .2s;padding:0}
.nsw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.nsw[aria-checked=true]{background:var(--acc)}.nsw[aria-checked=true]::after{transform:translateX(18px)}
.ndt{display:grid;grid-template-columns:1.3fr 1fr;gap:10px}
#drwDlg{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(10,14,24,.45)}
#drwDlg[hidden]{display:none}
.ndc{width:100%;max-width:360px;max-height:90vh;overflow:auto;background:var(--solid);color:var(--ink);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.ncards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.ncard{border:1px solid transparent;border-radius:16px;overflow:hidden;background:var(--hover);padding:0;text-align:left;cursor:pointer;color:var(--ink);font:600 13.5px Geist,Inter,system-ui;transition:border-color .15s,transform .12s}
.ncard:hover{border-color:color-mix(in srgb,var(--acc) 45%,transparent)}.ncard:active{transform:scale(.97)}
.ncard svg{display:block;width:100%;height:56px;color:var(--ink)}.ncard span{display:block;padding:10px 12px 12px}
.nmk{position:relative;width:22px;height:22px}
.nmk i{display:block;position:relative;width:22px;height:22px;border-radius:50%;background:#e5484d;border:2.5px solid #fff;box-sizing:border-box;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.nmk i::after{content:"";position:absolute;inset:4px;background:#fff;border-radius:2px}
.nmk span{position:absolute;left:14px;top:28px;white-space:nowrap;background:var(--solid);color:var(--ink);padding:6px 10px;border-radius:10px;font:600 12.5px Geist,Inter,system-ui;box-shadow:0 4px 14px -4px rgba(0,0,0,.4)}
.dinfo{margin:2px 2px 0;color:var(--sub);font:500 12.5px/1.45 Geist,Inter,system-ui}
#updMap{position:absolute;inset:0}
.updClose{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;z-index:2;width:46px;height:46px;border-radius:50%;color:var(--ink);padding:0}
.updHint{position:absolute;z-index:2;top:max(22px,env(safe-area-inset-top));left:72px;right:14px;padding:12px 16px;border-radius:999px;font:600 13.5px Geist,Inter,system-ui;text-align:center}
.updList{position:absolute;z-index:3;left:0;right:0;bottom:0;max-height:50vh;overflow:auto;overscroll-behavior:contain;border-radius:24px 24px 0 0;padding:6px 10px calc(14px + env(safe-area-inset-bottom))}
.updList:empty{display:none}
@media(min-width:641px){.updList{left:14px;right:auto;width:392px;bottom:14px;border-radius:var(--r)}}
.ei-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px 14px;padding:2px 18px 6px}
.ei-chips::-webkit-scrollbar{display:none}
.ech{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--solid);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 13px Geist,Inter,system-ui;cursor:pointer;white-space:nowrap}
.ech.on{background:color-mix(in srgb,var(--acc) 14%,transparent);border-color:color-mix(in srgb,var(--acc) 40%,transparent);color:var(--acc)}
.ech svg{color:var(--acc)}
.ei-sec{border-top:1px solid var(--line);padding:12px 0 6px}
.ei-sec>h4{margin:6px 0 4px}
.dk{display:flex;align-items:center;gap:10px;margin:8px 0 12px;font-size:13.5px;color:var(--ink);cursor:pointer}
.dk input{width:18px;height:18px;margin:0;accent-color:var(--acc)}
.fbar .btn:disabled{opacity:.45;cursor:default;filter:none;transform:none}
.pr2-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.pr2{display:flex;align-items:center;gap:16px;width:100%;border:0;background:var(--hover);border-radius:16px;padding:16px;font:500 15.5px Inter,system-ui;color:var(--ink);cursor:pointer;text-align:left}
.pr2 .pi{flex:none;display:grid;place-items:center;color:var(--acc)}
.pr2 .pt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr2 i{font-style:normal;color:var(--sub);font-size:20px}
.pr2.add .pt{font-style:italic;color:var(--sub)}
.pr2.warn{color:var(--acc)}
.pr2.warn .pt{color:var(--acc)}
.ep-link{margin:18px 0 0;color:var(--acc);font:500 14.5px Inter,system-ui}
.ep-sm{font-size:13.5px;margin-top:12px}
.ep-sm span{color:var(--sub)}
.pr-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.pr{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:var(--hover);border-radius:14px;padding:15px 16px;font:500 15px Inter,system-ui;color:var(--ink);cursor:pointer;text-align:left}
.pr i{font-style:normal;color:var(--sub);font-size:20px}
.pr.warn{color:var(--acc)}
.hbtn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);background:var(--solid);color:var(--ink);border-radius:12px;padding:12px 14px;font:500 15px Inter,system-ui;text-align:left;cursor:pointer}
.hbtn .ph{color:var(--sub);font-style:italic}
#hrsPanel{position:fixed;inset:0;z-index:30;background:var(--solid);display:flex;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));overflow:auto}
#hrsPanel[hidden]{display:none}
.hp-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hp-top h3{font:600 24px Geist,Inter,system-ui;margin:0}
.hp-row{display:flex;align-items:center;gap:10px;padding:14px 4px;border-bottom:1px solid var(--line);font-size:15px}
.hp-row>span:first-child{width:96px;flex:none}
.hp-v{flex:1;text-align:right;min-width:0}
.hp-v.ph{color:var(--sub);font-style:italic}
.hp-row .ib{flex:none}
.hp-chips{display:flex;gap:8px;overflow-x:auto;margin:16px 0;scrollbar-width:none}
.hp-chips button{flex:none;border:1px solid var(--line);background:none;color:#00838f;border-radius:999px;padding:10px 16px;font:600 14px Geist,Inter,system-ui;cursor:pointer}
.hp-foot{display:flex;gap:10px;margin-top:auto;padding-top:14px}
.hp-foot .btn,.hd-foot .btn{flex:1}
.hp-foot .btn.p,.hd-foot .btn.p{background:#00838f;box-shadow:none}
#hdDlg{position:fixed;inset:0;z-index:31;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px}
#hdDlg[hidden]{display:none}
.hd-card{background:var(--solid);border-radius:24px;padding:22px 18px 16px;width:100%;max-width:360px;max-height:calc(100dvh - 40px);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.hd-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-right:4px;-webkit-overflow-scrolling:touch}
.hd-card .hd-foot{flex:none;padding-top:12px;border-top:1px solid var(--line)}
.hd-card h4{margin:0 0 14px;text-align:center;font:600 19px Geist,Inter,system-ui}
.hd-days{display:flex;justify-content:space-between;gap:4px}
.hd-day{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);font:600 15px Inter,system-ui;cursor:pointer;padding:0}
.hd-day.on{background:color-mix(in srgb,#00bcd4 22%,transparent);color:#00838f;border-color:transparent}
.hd-opts{display:flex;justify-content:space-around;flex-wrap:wrap;gap:8px;margin:16px 0;font-size:14.5px}
.hd-opts label,.dk{display:flex;gap:8px;align-items:center;cursor:pointer}
.hd-opts input,.dk input{width:18px;height:18px;accent-color:#00838f}
.hd-rg{display:flex;gap:10px;align-items:flex-end;margin-bottom:10px}
.hd-tf{flex:1;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--sub)}
.hd-tf input{border:1px solid var(--line);border-radius:10px;background:var(--hover);color:var(--ink);padding:10px;font:500 15px Inter,system-ui}
.hd-add{border:0;background:none;color:#00838f;font:600 15px Inter,system-ui;padding:8px 0;cursor:pointer;display:block;margin:4px auto 0}
.hd-foot{display:flex;gap:10px;margin-top:14px}
#tilt{position:absolute;z-index:5;right:14px;top:110px;transition:top .3s}
#ctrl{position:absolute;z-index:5;right:14px;top:max(14px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:10px}
.stack{display:flex;flex-direction:column;border-radius:16px;overflow:hidden}
.stack .ib{width:46px;height:44px;border-radius:0;color:var(--ink);font:700 13px Geist,Inter}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>LK Maps · Sri Lanka</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.16.0/dist/maplibre-gl.css"
    />
    <link rel="stylesheet" href="/map.css" />
    <script src="https://cdn.jsdelivr.net/npm/pmtiles@4.5.0/dist/pmtiles.js"></script>
  </head>
  <body>
    <nav class="rail" aria-label="Navigation">
      <button id="menu" aria-label="Open menu">
        <span data-icon="menu"></span>
      </button>
      <button id="saved" aria-label="Saved places">
        <span data-icon="bookmark"></span><small>Saved</small>
      </button>
      <button id="recent" aria-label="Recent searches">
        <span data-icon="history"></span><small>Recents</small>
      </button>
      <a class="brand" href="/" aria-label="LK Maps home"
        >LK<small>Maps</small></a
      >
    </nav>
    <main id="map" aria-label="Map of Sri Lanka"></main>
    <section class="search-shell" aria-label="Place search">
      <form id="search-form" autocomplete="off">
        <input
          id="search"
          type="search"
          aria-label="Search Sri Lanka"
          placeholder="Search LK Maps"
        />
        <button
          id="clear-search"
          type="button"
          aria-label="Clear search"
          hidden
        >
          <span data-icon="close"></span>
        </button>
        <button type="submit" aria-label="Search">
          <span data-icon="search"></span>
        </button>
        <span class="divider"></span>
        <button id="directions" type="button" aria-label="Open directions">
          <span data-icon="directions"></span>
        </button>
      </form>
      <div id="suggestions" role="listbox" hidden></div>
    </section>
    <nav id="categories" aria-label="Place categories">
      <button data-kind="food">
        <span data-icon="restaurant"></span> Restaurants
      </button>
      <button data-kind="shopping">
        <span data-icon="shop"></span> Shopping
      </button>
      <button data-kind="leisure">
        <span data-icon="playground"></span> Things to do
      </button>
      <button data-kind="culture">
        <span data-icon="museum"></span> Museums
      </button>
      <button data-kind="transport">
        <span data-icon="bus"></span> Transit
      </button>
      <button data-kind="health">
        <span data-icon="hospital"></span> Health
      </button>
      <button id="reset-category" aria-label="Clear category filter" hidden>
        <span data-icon="close"></span>
      </button>
    </nav>
    <aside id="panel" aria-label="Place information" hidden>
      <button id="close-panel" class="close" aria-label="Close panel">
        <span data-icon="close"></span>
      </button>
      <div id="panel-content"></div>
    </aside>
    <button id="layers" class="layers" aria-label="Map details">
      <span class="mini-map"></span
      ><span class="layers-label"><span data-icon="layers"></span> Layers</span>
    </button>
    <section id="layer-panel" class="layer-panel" hidden>
      <strong>Map details</strong
      ><label><input id="show-places" type="checkbox" checked /> Places</label
      ><label
        ><input id="show-buildings" type="checkbox" checked /> Buildings</label
      >
    </section>
    <div class="map-controls">
      <button
        id="locate"
        aria-label="Show your location"
        title="Show your location"
      >
        <span data-icon="locate"></span>
      </button>
      <div class="zoom-controls">
        <button id="zoom-in" aria-label="Zoom in">
          <span data-icon="plus"></span></button
        ><button id="zoom-out" aria-label="Zoom out">
          <span data-icon="minus"></span>
        </button>
      </div>
      <button
        id="compass"
        aria-label="Reset bearing to north"
        title="Reset bearing to north"
      >
        <span data-icon="compass"></span>
      </button>
    </div>
    <div
      id="map-status"
      class="map-status"
      role="status"
      aria-live="polite"
    ></div>
    <div id="error" role="alert" hidden></div>
    <script type="module" src="/icons.js"></script>
    <script type="module" src="/map.js"></script>
  </body>
</html>

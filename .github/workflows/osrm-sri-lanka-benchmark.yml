name: Experimental Sri Lanka OSRM memory benchmark

on:
  push:
    branches: [experiment/osrm-sri-lanka-memory]
    paths: [".github/workflows/osrm-sri-lanka-benchmark.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install OSRM and benchmark dependencies
        run: |
          docker pull osrm/osrm-backend:latest
          command -v docker
          command -v /usr/bin/time
      - name: Download complete Sri Lanka extract
        run: |
          mkdir -p /tmp/osrm-sri-lanka
          curl -fL --retry 4 --retry-delay 5 https://download.geofabrik.de/asia/sri-lanka-latest.osm.pbf -o /tmp/osrm-sri-lanka/sri-lanka.osm.pbf
          ls -lh /tmp/osrm-sri-lanka/sri-lanka.osm.pbf
      - name: Preprocess with MLD and capture peak memory
        run: |
          set -euo pipefail
          cd /tmp/osrm-sri-lanka
          /usr/bin/time -v -o "$GITHUB_WORKSPACE/extract-memory.txt" docker run --rm -v "$PWD:/data" -w /data osrm/osrm-backend:latest osrm-extract -p /opt/car.lua /data/sri-lanka.osm.pbf
          /usr/bin/time -v -o "$GITHUB_WORKSPACE/partition-memory.txt" docker run --rm -v "$PWD:/data" -w /data osrm/osrm-backend:latest osrm-partition /data/sri-lanka.osrm
          /usr/bin/time -v -o "$GITHUB_WORKSPACE/customize-memory.txt" docker run --rm -v "$PWD:/data" -w /data osrm/osrm-backend:latest osrm-customize /data/sri-lanka.osrm
          du -ch sri-lanka.osrm* | tail -1
      - name: Run real OSRM server and concurrent requests
        run: |
          set -euo pipefail
          docker run --rm --name osrm-sri-lanka-bench --network host -v /tmp/osrm-sri-lanka:/data:ro osrm/osrm-backend:latest osrm-routed --algorithm mld --mmap --threads 2 --port 5000 /data/sri-lanka.osrm >osrm-server.log 2>&1 &
          echo $! > osrm.pid
          for attempt in $(seq 1 30); do
            if docker inspect -f "{{.State.Pid}}" osrm-sri-lanka-bench > osrm.pid 2>/dev/null && test "$(cat osrm.pid)" -gt 1; then break; fi
            sleep 1
          done
          test "$(cat osrm.pid)" -gt 1
          python3 scripts/benchmark-osrm.py
      - name: Test OSRM under Workers-equivalent 128 MiB container memory cap
        if: always()
        run: |
          set -uo pipefail
          docker rm -f osrm-sri-lanka-bench >/dev/null 2>&1 || true
          docker run -d --name osrm-sri-lanka-128m --network host \
            --memory 128m --memory-swap 128m --memory-swappiness 0 \
            -v /tmp/osrm-sri-lanka:/data:ro osrm/osrm-backend:latest \
            osrm-routed --algorithm mld --mmap --threads 2 --port 5000 /data/sri-lanka.osrm >128m-container-id.txt
          status=0
          for attempt in $(seq 1 60); do
            if ! test "$(docker inspect -f '{{.State.Running}}' osrm-sri-lanka-128m)" = true; then status=1; break; fi
            if curl -fsS 'http://127.0.0.1:5000/nearest/v1/driving/81.7245,7.6803' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          if [ "$status" -eq 0 ] && curl -fsS 'http://127.0.0.1:5000/nearest/v1/driving/81.7245,7.6803' >/dev/null 2>&1; then
            docker inspect -f '{{.State.Pid}}' osrm-sri-lanka-128m > osrm.pid
            timeout 180 python3 scripts/benchmark-osrm.py > 128m-benchmark.log 2>&1 || status=$?
          else
            echo "OSRM did not start within the 128 MiB cap" > 128m-benchmark.log
          fi
          docker stats --no-stream --format '{{.MemUsage}}' osrm-sri-lanka-128m > 128m-docker-memory.txt 2>&1 || true
          docker inspect -f 'ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} Running={{.State.Running}}' osrm-sri-lanka-128m > 128m-container-status.txt
          docker logs osrm-sri-lanka-128m >128m-server.log 2>&1 || true
          echo "Benchmark exit status: $status" >>128m-container-status.txt
          docker rm -f osrm-sri-lanka-128m >/dev/null 2>&1 || true
          echo "128 MiB test completed; see uploaded logs for OOM and request results"
      - name: Upload logs and benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sri-lanka-osrm-memory-results
          path: |
            *-memory.txt
            osrm-server.log
            osrm-results.json
            128m-*
          if-no-files-found: warn

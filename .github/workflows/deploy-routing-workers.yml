name: Deploy private Sifric routing Workers

on:
  push:
    branches: [main]
    paths: ["routing-worker/**", "worker/routing.mjs"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: production
    strategy:
      fail-fast: false
      matrix:
        mode: [drive, walk, cycle, motorcycle, tuk]
    concurrency: sifric-router-${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify private Worker bundle
        env:
          MODE: ${{ matrix.mode }}
        run: npx --yes wrangler@4.166.0 deploy --config routing-worker/wrangler.jsonc --name "maps-router-$MODE" --var "SIFRIC_ROUTING_MODE:$MODE" --dry-run
      - name: Deploy the private Worker
        env:
          MODE: ${{ matrix.mode }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.166.0 deploy --config routing-worker/wrangler.jsonc --name "maps-router-$MODE" --var "SIFRIC_ROUTING_MODE:$MODE"

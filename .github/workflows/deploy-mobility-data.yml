name: Deploy Sifric transit and address data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 0,12 * * *'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: production
    concurrency: sifric-transit-address-data
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Import Lanka Metro Transit schedules
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors --max-time 45 --max-filesize 10000000 \
            'https://api.transit.seyone.dev/api/v1/gtfs/download?agency=LMT' -o /tmp/lmt.zip
          python3 scripts/build_transit.py /tmp/lmt.zip /tmp/lmt.json --require-upcoming
          npx --yes wrangler@4.166.0 r2 object put 'mazo-maps/lkmaps/transit/v1/lmt.json' \
            --file /tmp/lmt.json --content-type application/json --remote
      - name: Import mapped premises
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-all-errors --max-time 180 \
            'https://download.geofabrik.de/asia/sri-lanka/sri-lanka-latest.osm.pbf' -o /tmp/sri-lanka.osm.pbf
          python3 -m venv /tmp/premises-venv
          /tmp/premises-venv/bin/pip install --disable-pip-version-check 'osmium==4.3.2'
          /tmp/premises-venv/bin/python scripts/build_premises.py /tmp/sri-lanka.osm.pbf /tmp/premises.json
          npx --yes wrangler@4.166.0 r2 object put 'mazo-maps/lkmaps/address/v1/premises.json' \
            --file /tmp/premises.json --content-type application/json --remote

name: Deploy Sifric Maps datasets

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Dataset to refresh
        default: all
        options: [all, drive, walk, cycle, relief, photos, cells]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 25
    concurrency:
      group: deploy-maps-routing-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Prepare graph compiler
        if: inputs.mode != 'relief' && inputs.mode != 'photos' && inputs.mode != 'cells'
        run: |
          set -euo pipefail
          git init /tmp/routingkit
          git -C /tmp/routingkit fetch --depth 1 https://github.com/RoutingKit/RoutingKit.git 54d49bb0cdea56dde182357522e4e86a03c57852
          git -C /tmp/routingkit checkout --detach FETCH_HEAD
          make -C /tmp/routingkit -j2 lib/libroutingkit.a
          g++ -std=c++17 -O3 -DNDEBUG -I/tmp/routingkit/include scripts/build_routing_graph.cpp \
            /tmp/routingkit/lib/libroutingkit.a -fopenmp -lz -pthread -o /tmp/build-routing-graph
      - name: Build Sri Lanka graph artifacts
        if: inputs.mode != 'relief' && inputs.mode != 'photos' && inputs.mode != 'cells'
        env:
          PROFILE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 180 \
            'https://download.geofabrik.de/asia/sri-lanka/sri-lanka-latest.osm.pbf' -o /tmp/sri-lanka.osm.pbf
          mkdir -p /tmp/sifric-graphs
          modes=("$PROFILE")
          if [ "$PROFILE" = all ]; then modes=(drive walk cycle); fi
          for mode in "${modes[@]}"; do
            /tmp/build-routing-graph /tmp/sri-lanka.osm.pbf "/tmp/sifric-graphs/${mode}.bin" "$mode"
          done
          node scripts/check_routing_data.mjs /tmp/sifric-graphs "${modes[@]}"
      - name: Publish routing objects to the Maps bucket
        if: inputs.mode != 'relief' && inputs.mode != 'photos' && inputs.mode != 'cells'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          shopt -s nullglob
          files=(/tmp/sifric-graphs/*.bin)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            mode="$(basename "$file" .bin)"
            npx --yes wrangler@4.166.0 r2 object put "mazo-maps/lkmaps/routing/v1/${mode}.bin" \
              --file "/tmp/sifric-graphs/${mode}.bin" --content-type application/octet-stream --remote || exit $?
          done
      - name: Import NOAA relief and publish it to the Maps bucket
        if: inputs.mode == 'relief' || inputs.mode == 'all'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 -m venv /tmp/sifric-relief-venv
          /tmp/sifric-relief-venv/bin/pip install --disable-pip-version-check 'scipy==1.17.0'
          curl -fsSL --retry 4 --retry-all-errors --connect-timeout 20 --max-time 90 \
            'https://oceanwatch.pifsc.noaa.gov/erddap/griddap/ETOPO_2022_v1_15s.nc?z%5B(4.99):1:(10.51)%5D%5B(77.99):1:(82.51)%5D' \
            -o /tmp/lk-relief.nc
          /tmp/sifric-relief-venv/bin/python scripts/build_relief.py /tmp/lk-relief.nc /tmp/lk-relief.bin
          npx --yes wrangler@4.166.0 r2 object put 'mazo-maps/lkmaps/relief/etopo-2022-lk.bin' \
            --file /tmp/lk-relief.bin --content-type application/octet-stream --remote
      - name: Match and publish licensed place photos
        if: inputs.mode == 'photos' || inputs.mode == 'all'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ ! -s /tmp/sri-lanka.osm.pbf ]; then
            curl -fsSL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 180 \
              'https://download.geofabrik.de/asia/sri-lanka/sri-lanka-latest.osm.pbf' -o /tmp/sri-lanka.osm.pbf
          fi
          python3 -m venv /tmp/sifric-photos-venv
          /tmp/sifric-photos-venv/bin/pip install --disable-pip-version-check 'osmium==4.3.2'
          /tmp/sifric-photos-venv/bin/python scripts/build_place_photos.py \
            /tmp/sri-lanka.osm.pbf worker/public/assets/places-search.json.gz /tmp/place-photos.json
          npx --yes wrangler@4.166.0 r2 object put 'mazo-maps/lkmaps/places/v1/photos.json' \
            --file /tmp/place-photos.json --content-type application/json --remote
      - name: Import Sri Lanka OpenCellID locations
        if: inputs.mode == 'cells' || inputs.mode == 'all'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
            'https://huggingface.co/datasets/yuiseki/opencellid/resolve/82e4acdb5ea93250ea6128ce08c03a4ca8870c88/raw/2026-10-06/cell_towers.csv.gz?download=true' \
            -o /tmp/cell-towers.csv.gz
          printf '%s  %s\n' '6ce8d77f1b421aa76ff9aafb7887043e4bbebbc6bdab5edcdf8a3d6cabd48c89' /tmp/cell-towers.csv.gz | sha256sum -c
          python3 scripts/build_cell_locations.py /tmp/cell-towers.csv.gz /tmp/lk-cells.bin
          npx --yes wrangler@4.166.0 r2 object put 'mazo-maps/lkmaps/geolocation/v1/lk-2026-10-06.bin' \
            --file /tmp/lk-cells.bin --content-type application/octet-stream --remote

name: Build Sri Lanka Tiles

on:
  workflow_dispatch:
  push:
    branches:
      - feature/places-tiles
    paths:
      - 'data/places/**'
      - 'scripts/**'
      - '.github/workflows/build-tiles.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install tippecanoe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          cd /tmp/tippecanoe && make -j"$(nproc)" && sudo make install

      - name: Install pmtiles CLI
        env:
          PMTILES_VERSION: "1.31.2"
        run: |
          url="https://github.com/protomaps/go-pmtiles/releases/download/v${PMTILES_VERSION}/go-pmtiles_${PMTILES_VERSION}_Linux_x86_64.tar.gz"
          echo "Downloading pmtiles ${PMTILES_VERSION} from ${url}"
          curl -fsSL -o /tmp/pmtiles.tar.gz "${url}"
          if ! gzip -t /tmp/pmtiles.tar.gz; then
            echo "::error::Downloaded file is not valid gzip"
            exit 1
          fi
          sudo tar xz -C /usr/local/bin -f /tmp/pmtiles.tar.gz pmtiles
          pmtiles version

      - name: Cache Geofabrik PBF and Planetiler JAR
        uses: actions/cache@v4
        with:
          path: .cache/
          key: basemap-cache-${{ hashFiles('scripts/build_basemap.sh') }}
          restore-keys: |
            basemap-cache-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build basemap
        run: bash scripts/build_basemap.sh

      - name: Build places tiles
        run: python3 scripts/build_places_tiles.py

      - name: Install land geometry dependencies
        run: python3 -m pip install pyogrio pyproj 'shapely>=2,<3'

      - name: Build country land tiles
        run: |
          python3 scripts/build_country_land.py
          tippecanoe -o build/country_land.pmtiles -Z0 -z14 -l country_land --force build/country_land.geojson

      - name: Merge tiles
        run: bash scripts/merge_tiles.sh

      - name: Show tile info
        run: |
          echo "=== places.pmtiles ==="
          pmtiles show build/places.pmtiles
          echo ""
          echo "=== basemap.pmtiles ==="
          pmtiles show build/basemap.pmtiles
          echo ""
          echo "=== sri-lanka.pmtiles ==="
          pmtiles show build/sri-lanka.pmtiles

      - name: Create prerelease
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="lkmaps-${GITHUB_SHA::8}"
          echo "## Sri Lanka Map Tiles Build" > /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "- **Commit:** \`${GITHUB_SHA}\`" >> /tmp/release-notes.md
          echo "- **Branch:** \`${GITHUB_REF_NAME}\`" >> /tmp/release-notes.md
          echo "- **Run:** [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "© OpenStreetMap contributors" >> /tmp/release-notes.md
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag already exists, uploading with --clobber"
            gh release upload "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              build/sri-lanka.pmtiles \
              build/manifest.json \
              places.sha256
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "Sri Lanka tiles ${tag}" \
              --notes-file /tmp/release-notes.md \
              build/sri-lanka.pmtiles \
              build/manifest.json \
              places.sha256
          fi

      - name: Cleanup old prereleases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for prefix in places- lkmaps-; do
            tags=$(gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 100000 \
              --json tagName,isPrerelease,publishedAt \
              --jq "[.[] | select(.isPrerelease and (.tagName | startswith(\"$prefix\")))] | sort_by(.publishedAt, .tagName) | reverse | map(.tagName)")
            count=$(echo "$tags" | jq 'length')
            echo "Found $count ${prefix}* prereleases; retaining the newest 3"
            echo "$tags" | jq -r '.[3:][]' | while read -r old_tag; do
              echo "Deleting old prerelease: $old_tag"
              gh release delete "$old_tag" \
                --repo "$GITHUB_REPOSITORY" \
                --cleanup-tag \
                -y
            done
          done

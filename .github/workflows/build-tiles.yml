name: Build Sri Lanka Tiles

on:
  workflow_dispatch:
  push:
    branches:
      - feature/places-tiles
    paths:
      - 'data/places/**'
      - 'scripts/**'
      - '.github/workflows/build-tiles.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install tippecanoe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          cd /tmp/tippecanoe && make -j"$(nproc)" && sudo make install

      - name: Install pmtiles CLI
        env:
          PMTILES_VERSION: "1.31.2"
        run: |
          url="https://github.com/protomaps/go-pmtiles/releases/download/v${PMTILES_VERSION}/go-pmtiles_${PMTILES_VERSION}_Linux_x86_64.tar.gz"
          echo "Downloading pmtiles ${PMTILES_VERSION} from ${url}"
          curl -fsSL -o /tmp/pmtiles.tar.gz "${url}"
          if ! gzip -t /tmp/pmtiles.tar.gz; then
            echo "::error::Downloaded file is not valid gzip"
            exit 1
          fi
          sudo tar xz -C /usr/local/bin -f /tmp/pmtiles.tar.gz pmtiles
          pmtiles version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install archive dependency
        run: python3 -m pip install 'pmtiles==3.8.1'

      - name: Download unchanged basemap reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download lkmaps-dd9aa3e8 --repo "$GITHUB_REPOSITORY" --pattern sri-lanka.pmtiles --dir build/reference
          echo "bc804addb463eeb086dad58622a41514adadb4069525d31b5702186e61444bde  build/reference/sri-lanka.pmtiles" | sha256sum -c -

      - name: Verify place data checksums
        run: sha256sum -c places.sha256 > build/place-checksums.log

      - name: Build places tiles
        run: python3 scripts/build_places_tiles.py

      - name: Verify search matches tile inputs
        run: |
          python3 scripts/build_search_index.py build/places.geojson build/places-search.json
          cmp build/places-search.json worker/public/assets/places-search.json

      - name: Replace places and verify all other layers are unchanged
        run: python3 scripts/replace_places_layer.py build/reference/sri-lanka.pmtiles build/places.pmtiles build/sri-lanka.pmtiles

      - name: Show tile info
        run: |
          echo "=== places.pmtiles ==="
          pmtiles show build/places.pmtiles
          echo ""
          echo "=== sri-lanka.pmtiles ==="
          pmtiles show build/sri-lanka.pmtiles

      - name: Create prerelease
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="lkmaps-${GITHUB_SHA::8}"
          echo "## Sri Lanka Map Tiles Build" > /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "- **Commit:** \`${GITHUB_SHA}\`" >> /tmp/release-notes.md
          echo "- **Branch:** \`${GITHUB_REF_NAME}\`" >> /tmp/release-notes.md
          echo "- **Run:** [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "© OpenStreetMap contributors" >> /tmp/release-notes.md
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag already exists, uploading with --clobber"
            gh release upload "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              build/sri-lanka.pmtiles \
              build/manifest.json \
              places.sha256
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "Sri Lanka tiles ${tag}" \
              --notes-file /tmp/release-notes.md \
              build/sri-lanka.pmtiles \
              build/manifest.json \
              places.sha256
          fi

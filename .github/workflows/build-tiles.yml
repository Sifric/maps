name: Build Places Tiles

on:
  workflow_dispatch:
  push:
    branches:
      - feature/places-tiles
    paths:
      - 'data/places/**'
      - 'scripts/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install tippecanoe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          cd /tmp/tippecanoe && make -j"$(nproc)" && sudo make install

      - name: Install pmtiles CLI
        env:
          PMTILES_VERSION: "1.31.2"
        run: |
          url="https://github.com/protomaps/go-pmtiles/releases/download/v${PMTILES_VERSION}/go-pmtiles_${PMTILES_VERSION}_Linux_x86_64.tar.gz"
          echo "Downloading pmtiles ${PMTILES_VERSION} from ${url}"
          curl -fsSL -o /tmp/pmtiles.tar.gz "${url}"
          if ! gzip -t /tmp/pmtiles.tar.gz; then
            echo "::error::Downloaded file is not valid gzip"
            exit 1
          fi
          sudo tar xz -C /usr/local/bin -f /tmp/pmtiles.tar.gz pmtiles
          pmtiles version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build tiles
        run: python3 scripts/build_places_tiles.py

      - name: Show tile info
        run: pmtiles show build/places.pmtiles

      - name: Create prerelease
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="places-${GITHUB_SHA::8}"
          echo "## Places Tiles Build" > /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "- **Commit:** \`${GITHUB_SHA}\`" >> /tmp/release-notes.md
          echo "- **Branch:** \`${GITHUB_REF_NAME}\`" >> /tmp/release-notes.md
          echo "- **Run:** [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> /tmp/release-notes.md
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag already exists, uploading with --clobber"
            gh release upload "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              build/places.pmtiles \
              build/manifest.json \
              places.sha256
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "Places tiles ${tag}" \
              --notes-file /tmp/release-notes.md \
              build/places.pmtiles \
              build/manifest.json \
              places.sha256
          fi

      - name: Cleanup old prereleases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags=$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("places-"))) | .tagName] | sort | reverse')
          count=$(echo "$tags" | jq 'length')
          echo "Found $count places-* prereleases"
          if [ "$count" -lt 4 ]; then
            echo "Fewer than 4 prereleases, nothing to clean up"
            exit 0
          fi
          echo "$tags" | jq -r '.[3:][]' | while read -r old_tag; do
            echo "Deleting old prerelease: $old_tag"
            gh release delete "$old_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --cleanup-tag \
              -y
          done

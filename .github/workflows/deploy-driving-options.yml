name: Deploy Sifric road routing profiles

on:
  workflow_dispatch:
    inputs:
      profiles:
        type: choice
        description: Routing graphs to refresh
        default: avoidance
        options: [avoidance, all]
      source_checksum:
        type: string
        description: SHA-256 of a private staged Geofabrik extract (optional)

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(inputs.profiles == 'all' && '["drive","walk","cycle","motorcycle","tuk","drive-no-tolls","drive-no-highways"]' || '["drive-no-tolls","drive-no-highways"]') }}
    concurrency: sifric-graph-${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Load the staged Geofabrik extract
        if: inputs.source_checksum != ''
        env:
          SOURCE_SHA: ${{ inputs.source_checksum }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{64}$ ]]
          for part in 01 02; do
            npx --yes wrangler@4.166.0 r2 object get \
              "mazo-maps/lkmaps/routing/import/$SOURCE_SHA.part$part" --file "/tmp/osm-part$part" --remote
          done
          cat /tmp/osm-part01 /tmp/osm-part02 > /tmp/lk.osm.pbf
          printf '%s  %s\n' "$SOURCE_SHA" /tmp/lk.osm.pbf | sha256sum -c
      - name: Build and validate a routing graph
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          if [ ! -s /tmp/lk.osm.pbf ]; then
            curl -fsSL --retry 4 --retry-all-errors --connect-timeout 12 --max-time 180 \
              https://download.geofabrik.de/asia/sri-lanka/sri-lanka-latest.osm.pbf -o /tmp/lk.osm.pbf
          fi
          git init /tmp/routingkit
          git -C /tmp/routingkit fetch --depth 1 https://github.com/RoutingKit/RoutingKit.git 54d49bb0cdea56dde182357522e4e86a03c57852
          git -C /tmp/routingkit checkout --detach FETCH_HEAD
          make -C /tmp/routingkit -j2 lib/libroutingkit.a
          g++ -std=c++17 -O3 -DNDEBUG -I/tmp/routingkit/include scripts/build_routing_graph.cpp \
            /tmp/routingkit/lib/libroutingkit.a -fopenmp -lz -pthread -o /tmp/build-routing
          /tmp/build-routing /tmp/lk.osm.pbf /tmp/graph.bin "$PROFILE"
          mkdir /tmp/options
          python3 scripts/pack_routing_graph.py /tmp/graph.bin "/tmp/options/$PROFILE.bin"
          node scripts/check_routing_data.mjs /tmp/options "$PROFILE"
      - name: Publish the verified graph to Maps R2
        env:
          PROFILE: ${{ matrix.profile }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.166.0 r2 object put "mazo-maps/lkmaps/routing/v2/$PROFILE.bin" --file "/tmp/options/$PROFILE.bin" --content-type application/octet-stream --remote
